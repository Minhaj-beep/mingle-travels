    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1f16" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Play the intro curtain only on the first page of a visit
      document.documentElement.classList.add('js')
      try {
        if (sessionStorage.getItem('mt-intro')) document.documentElement.classList.add('seen')
        else sessionStorage.setItem('mt-intro', '1')
      } catch (e) {
        document.documentElement.classList.add('seen')
      }
    </script>
