<!doctype html>
<html lang="en">
  <head>
<!-- @include head.html -->
    <title>Gallery | Mingle Travels, Sivasagar</title>
    <meta name="description" content="A visual journey through Northeast India: Assam, Arunachal Pradesh, Meghalaya and Nepal." />
  </head>
  <body>
<!-- @include header.html -->

    <main>
      <section class="page-hero page-hero--short">
        <img src="/images/slide-majuli.webp" alt="Sunrise over Majuli" />
        <div class="container">
          <p class="eyebrow" data-reveal style="--d: var(--intro)">Gallery</p>
          <h1 data-split>A glimpse of <em>paradise</em></h1>
        </div>
      </section>

      <section class="section section--plain">
        <div class="container">
          <div class="masonry" data-stagger>
            <button data-lightbox="Kaziranga National Park, Assam"><img src="/images/kaziranga.webp" alt="One-horned rhino in Kaziranga" loading="lazy" /><figcaption>Kaziranga, Assam</figcaption></button>
            <button data-lightbox="Sattriya dance, Assam"><img src="/images/sattriya.webp" alt="Sattriya dancer in traditional costume" loading="lazy" /><figcaption>Sattriya dance</figcaption></button>
            <button data-lightbox="Ziro Valley, Arunachal Pradesh"><img src="/images/ziro.webp" alt="Rice fields of Ziro Valley" loading="lazy" /><figcaption>Ziro Valley</figcaption></button>
            <button data-lightbox="Rang Ghar, Sivasagar"><img src="/images/rang-ghar.webp" alt="Rang Ghar pavilion" loading="lazy" /><figcaption>Rang Ghar, Sivasagar</figcaption></button>
            <button data-lightbox="Sunset over the Brahmaputra, Majuli"><img src="/images/majuli-sunset.webp" alt="Sunset over the Brahmaputra at Majuli" loading="lazy" /><figcaption>Brahmaputra sunset</figcaption></button>
            <button data-lightbox="Living root bridge, Meghalaya"><img src="/images/root-bridge.webp" alt="Living root bridge" loading="lazy" /><figcaption>Living root bridge</figcaption></button>
            <button data-lightbox="Bihu dance, Assam"><img src="/images/bihu.webp" alt="Bihu dancers" loading="lazy" /><figcaption>Bihu dance</figcaption></button>
            <button data-lightbox="Tawang Monastery, Arunachal Pradesh"><img src="/images/tawang-monastery.webp" alt="Tawang Monastery" loading="lazy" /><figcaption>Tawang Monastery</figcaption></button>
            <button data-lightbox="Mask of Samaguri Satra, Majuli"><img src="/images/majuli-mask.webp" alt="Traditional satra mask" loading="lazy" /><figcaption>Majuli mask-making</figcaption></button>
            <button data-lightbox="Nohkalikai Falls, Meghalaya"><img src="/images/meghalaya.webp" alt="Nohkalikai Falls" loading="lazy" /><figcaption>Nohkalikai Falls</figcaption></button>
            <button data-lightbox="Golden Pagoda, Namsai"><img src="/images/namsai.webp" alt="Golden Pagoda, Namsai" loading="lazy" /><figcaption>Golden Pagoda, Namsai</figcaption></button>
            <button data-lightbox="Tea workers, Assam"><img src="/images/tea-workers.webp" alt="Tea workers in a garden" loading="lazy" /><figcaption>Assam tea gardens</figcaption></button>
            <button data-lightbox="Dawki, Meghalaya"><img src="/images/dawki.webp" alt="Dawki bridge over the Umngot river" loading="lazy" /><figcaption>Dawki</figcaption></button>
            <button data-lightbox="Talatal Ghar, Sivasagar"><img src="/images/talatal-ghar.webp" alt="Talatal Ghar" loading="lazy" /><figcaption>Talatal Ghar</figcaption></button>
            <button data-lightbox="Elephant safari, Kaziranga"><img src="/images/elephant-safari.webp" alt="Elephant safari in Kaziranga" loading="lazy" /><figcaption>Elephant safari</figcaption></button>
            <button data-lightbox="Boudhanath Stupa, Kathmandu"><img src="/images/nepal.webp" alt="Boudhanath Stupa" loading="lazy" /><figcaption>Boudhanath, Nepal</figcaption></button>
            <button data-lightbox="Brahmaputra at dusk"><img src="/images/brahmaputra.webp" alt="Boat on the Brahmaputra at dusk" loading="lazy" /><figcaption>Brahmaputra at dusk</figcaption></button>
            <button data-lightbox="Sela Pass, Arunachal Pradesh"><img src="/images/slide-sela.webp" alt="Ridges at Sela Pass" loading="lazy" /><figcaption>Sela Pass</figcaption></button>
          </div>
        </div>
      </section>
    </main>

<!-- @include footer.html -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
